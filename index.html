.equipped{padding:15px}.equipped-name{font-size:22px;font-weight:950;margin-top:7px;min-height:28px;overflow-wrap:anywhere}.stats{padding:9px 15px}.stat-row{height:34px;border-bottom:1px solid var(--line);font-size:12px}.stat-row:last-child{border:0}.auto,.theme-panel,.fast-panel{padding:13px}.switch{width:56px;height:30px;border-radius:99px;border:0;background:var(--track);cursor:pointer;padding:3px;flex:none}.switch i{display:block;width:24px;height:24px;border-radius:50%;background:#aab1b8;transition:transform .3s,background .2s}.switch.on{background:#36d39944}.switch.on i{transform:translateX(26px);background:#36d399;box-shadow:0 0 15px #36d39999}.roll-btn{height:57px;border:0;border-radius:16px;color:var(--buttonText);background:var(--button);font-size:15px;font-weight:950;letter-spacing:.15em;cursor:pointer;transition:.2s}.roll-btn:disabled{opacity:.65;cursor:wait}.fast-panel{display:flex;align-items:center;justify-content:space-between;gap:8px}.fast-label{font-size:12px;font-weight:900}.fast-detail{display:block;font-size:10px;color:var(--muted);margin-top:4px}.fast-toggle{height:31px;padding:0 10px;border:1px solid var(--line);background:var(--track);border-radius:9px;font-size:10px;font-weight:950;cursor:pointer}.fast-toggle.unlocked{background:#dff7ed;color:#16865d}.fast-toggle.active{background:#28b17d;color:white}.test-panel{margin-top:auto;padding:11px}.tabs{display:flex;gap:5px;padding:3px;border-radius:10px;background:var(--track);margin:8px 0}.tab{flex:1;border:0;border-radius:8px;padding:6px 3px;background:transparent;color:var(--muted);font-size:9px;font-weight:950;cursor:pointer}.tab.active{background:var(--panel);color:var(--ink)}.tab-content{display:none}.tab-content.active{display:block}.test-panel select{width:100%;height:33px;border:1px solid var(--line);border-radius:9px;background:var(--track);padding:0 8px;font-size:10px}.dev-actions,.amount-controls{display:flex;gap:6px;margin-top:6px}.dev-actions button,.amount-controls button{flex:1;min-height:30px;border:0;border-radius:8px;background:#e8e1ff;color:#6949cb;font-size:10px;font-weight:900;cursor:pointer}.amount-controls input{min-width:0;width:100%;height:30px;border:1px solid var(--line);border-radius:8px;background:var(--track);padding:0 7px}
.drawer{position:fixed;z-index:40;inset:0 auto 0 0;width:min(410px,94vw);background:var(--drawer);box-shadow:25px 0 70px #0003;transform:translateX(-105%);transition:transform .56s cubic-bezier(.2,.9,.25,1.1);padding:21px;border-right:1px solid var(--line)}.drawer.open{transform:translateX(0)}.drawer-head{display:flex;justify-content:space-between;align-items:center}.drawer h2{margin:5px 0}.close{border:0;width:38px;height:38px;border-radius:12px;background:var(--track);cursor:pointer;font-size:20px}.collection-filter{margin-top:10px;width:100%;height:34px;border:1px solid var(--line);border-radius:9px;background:var(--track);padding:0 8px}.collection-grid{height:calc(100vh - 140px);overflow:auto;display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px 4px 26px}.collection-section{grid-column:1/-1;margin:13px 0 0;padding:7px 3px;border-bottom:1px solid var(--line);font-size:11px;font-weight:950;letter-spacing:.16em;text-transform:uppercase}.item-card{height:80px;border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:9px;position:relative;text-align:left;cursor:pointer;transition:.2s}.item-card.locked{filter:grayscale(1);opacity:.4}.item-card.equipped{border:2px solid #ef4444;box-shadow:0 0 18px #ef444455}.item-card strong{display:block;margin-top:20px;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.item-card small{position:absolute;right:7px;top:7px;font-size:8px;font-weight:950}
.effects{position:fixed;inset:0;pointer-events:none;z-index:35;overflow:hidden}.particle{position:absolute;width:7px;height:7px;border-radius:50%;box-shadow:0 0 18px currentColor;animation:particle 2s cubic-bezier(.1,.7,.2,1) forwards}.reveal{position:absolute;z-index:36;left:50%;top:50%;transform:translate(-50%,-50%) scale(.6);font-size:clamp(36px,7vw,86px);font-weight:1000;opacity:0;text-align:center;animation:reveal 2.5s cubic-bezier(.2,.8,.2,1) forwards;white-space:nowrap}.reveal span{display:block;font-size:12px;letter-spacing:.35em;margin-bottom:10px}.chaos-layer{position:fixed;inset:0;z-index:32;background:#05030a;pointer-events:none;overflow:hidden;animation:darkIn .55s both}.chaos-layer:before{content:"";position:absolute;inset:-40%;background:conic-gradient(from 0deg,transparent,#ff216f55,transparent,#764cff77,transparent,#31eaff66,transparent,#ffe74755,transparent);filter:blur(24px);animation:spin 4s linear infinite}.chaos-layer:after{content:"";position:absolute;inset:0;background:radial-gradient(circle at center,transparent 5%,#030209 95%);animation:darkPulse 1s ease-in-out infinite alternate}.odds-title,.odds-counter,.odds-caption{position:absolute;z-index:3;left:50%;transform:translateX(-50%);text-align:center;white-space:nowrap}.odds-title{top:26%;font-size:clamp(12px,2vw,20px);font-weight:900;letter-spacing:.34em;color:#fff;text-shadow:0 0 20px var(--rarity-color)}.odds-counter{top:39%;font-size:clamp(42px,10vw,112px);font-weight:1000;font-variant-numeric:tabular-nums;letter-spacing:-.06em;color:#fff;text-shadow:0 0 15px #fff,0 0 42px var(--rarity-color),0 0 90px var(--rarity-color);animation:counterGlow .8s ease-in-out infinite alternate}.odds-caption{top:57%;font-size:clamp(10px,1.6vw,16px);font-weight:850;letter-spacing:.38em;color:#e8e8ff}.odds-shock{position:absolute;z-index:4;inset:0;pointer-events:none;animation:shock .8s ease-out}.odds-shock:before,.odds-shock:after{content:"";position:absolute;left:50%;top:50%;border:2px solid var(--rarity-color);border-radius:50%;transform:translate(-50%,-50%);animation:ring 1.6s ease-out infinite}.odds-shock:after{animation-delay:.45s}.odds-spark{position:absolute;z-index:2;left:50%;top:50%;width:var(--size);height:var(--size);border-radius:50%;background:var(--c);box-shadow:0 0 20px var(--c);animation:sparkFly var(--dur) cubic-bezier(.1,.7,.2,1) forwards}.suspense-exit{animation:darkOut .65s forwards!important}.luck-flash{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:#05030aee;color:#fff;font-size:clamp(54px,13vw,150px);font-weight:1000;letter-spacing:-.06em;text-shadow:0 0 20px #fff,0 0 60px #ffdc39,0 0 120px #d93bff;animation:luckFlash 2.1s forwards;pointer-events:none}.luck-flash small{display:block;text-align:center;font-size:12px;letter-spacing:.35em;margin-bottom:16px}.row-result{outline:3px solid var(--outline);outline-offset:-5px;box-shadow:inset 0 0 22px color-mix(in srgb,var(--outline),transparent 45%)}.reel-streak{position:absolute;z-index:10;left:0;right:0;height:90px;pointer-events:none;background:linear-gradient(90deg,transparent,#ffffff9c,transparent);mix-blend-mode:screen;animation:streak .5s forwards}.shake{animation:shake .5s}
@keyframes breathe{50%{transform:scale(1.04);text-shadow:0 0 32px #8877ff66}}@keyframes speedLines{50%{opacity:.65}}@keyframes outlinePulse{50%{border-color:var(--ink);box-shadow:0 0 0 2px var(--bg)}}@keyframes particle{to{transform:translate(var(--x),var(--y)) rotate(720deg) scale(.1);opacity:0}}@keyframes reveal{12%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}80%{opacity:1}to{opacity:0;transform:translate(-50%,-80%) scale(.85)}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes darkIn{from{opacity:0}to{opacity:1}}@keyframes darkOut{to{opacity:0;visibility:hidden}}@keyframes darkPulse{to{opacity:.35}}@keyframes counterGlow{to{filter:hue-rotate(70deg) brightness(1.6);transform:translateX(-50%) scale(1.035)}}@keyframes ring{to{width:100vmax;height:100vmax;opacity:0}}@keyframes sparkFly{to{transform:translate(var(--dx),var(--dy)) scale(.1) rotate(540deg);opacity:0}}@keyframes shock{10%{background:#fff8}100%{background:transparent}}@keyframes luckFlash{0%{opacity:0;transform:scale(.3) rotate(-8deg)}20%{opacity:1;transform:scale(1.07) rotate(2deg)}35%{transform:scale(1)}85%{opacity:1}100%{opacity:0;transform:scale(1.2)}}@keyframes glitch{50%{transform:translateX(1px);text-shadow:-3px 0 #f0f,3px 0 #0ff}}@keyframes divineText{to{filter:hue-rotate(130deg) brightness(1.5)}}@keyframes snow{to{transform:translateY(17px);opacity:.2}}@keyframes galaxy{to{background-position:220% 0}}@keyframes streak{from{transform:translateX(-120%) skewX(-20deg);opacity:0}35%{opacity:.85}to{transform:translateX(120%) skewX(-20deg);opacity:0}}@keyframes shake{20%{transform:translate(-8px,3px)}40%{transform:translate(8px,-3px)}60%{transform:translate(-5px,2px)}80%{transform:translate(4px)}}

<body>

<section class="panel boost"><div class="boost-head"><span class="boost-name">ULTRA ROLL</span><span class="boost-owned" id="ultraOwned">0 stored</span></div><div class="progress"><i id="ultraBar"></i></div><div class="boost-foot"><span class="eyebrow" id="ultraNext">Next Ultra: 0/25</span><div class="boost-controls"><button class="auto-use" id="autoUltra">AUTO USE</button><button class="use ultra" id="useUltra">USE 20×</button></div></div></section></aside>

<script>
const rarityInfo=[['Common','#7d858d',92],['Uncommon','#39b77d',7],['Rare','#4c88db',.9],['Epic','#9857cf',.09],['Legendary','#d89d25',.009],['Mythic','#e14654',.00005],['Divine','#ea66b6',.0000001]];
const rarityOdds={Common:1,Uncommon:2,Rare:18,Epic:100,Legendary:2000,Mythic:20000,Divine:1000000000};
const prefixes=['Stone','Cloud','Shadow','Solar','Void','Crystal','Frost','Phantom','Nova','Prism','Iron','Nebula','Ghost','Lunar','Storm','Galaxy','Quantum','Core','Aether','Omega','Ember','Glacier','Astral','Dusk','Radiant','Runic','Cosmic','Eclipse','Sapphire','Crimson','Silver','Golden','Frozen','Celestial','Arcane','Starlit','Obsidian','Tempest','Dream','Aurora'];
const suffixes=['Fragment','Shard','Crown','Vessel','Pulse','Wing','Core','Relic','Sigil','King','Blade','Orb','Star','Heart','Titan','Emperor','Dragon','God','Void','Genesis','Prism','Beacon','Warden','Lantern','Comet','Golem','Monarch','Talisman','Bloom','Mirage','Sentinel','Phoenix','Catalyst','Harbinger','Reverie','Sovereign','Bastion','Seraph','Enigma','Eternity'];
const items=[],usedNames=new Set(),counts=[35,35,45,45,40,30,20],divineNames=['Divine King','Eternal Zero','Rainbow Apex','Celestial Crown'];let nextId=0;
for(let r=0;r<rarityInfo.length;r++)for(let i=0;i<counts[r];i++){const rarity=rarityInfo[r][0];let name=rarity==='Divine'?divineNames[i%divineNames.length]:`${prefixes[(i*7+r*11)%prefixes.length]} ${suffixes[(i*13+r*17)%suffixes.length]}`;if(usedNames.has(name))name=`${prefixes[(i*11+3)%prefixes.length]} ${suffixes[(i*17+5)%suffixes.length]} ${['Prime','Awakened','Ascendant','Eternal'][i%4]}`;while(usedNames.has(name))name+=` ${['Alpha','Omega','Ancient','Radiant'][nextId%4]}`;usedNames.add(name);items.push({id:nextId++,name,rarity,color:rarityInfo[r][1],odds:rarityOdds[rarity]*counts[r]})}
const $=s=>document.querySelector(s),roulette=$('#roulette');let old={};try{old=JSON.parse(localStorage.getItem('rngRollState')||'{}')||{}}catch{}const state={total:0,super:0,ultra:0,equipped:null,best:null,found:[],fastUnlocked:false,fastEnabled:false,autoSuper:false,autoUltra:false,...old};state.found=Array.isArray(state.found)?state.found:[];state.fastUnlocked=Boolean(state.fastUnlocked||state.total>=500);state.fastEnabled=Boolean(state.fastEnabled&&state.fastUnlocked);let found=new Set(state.found),rolling=false,auto=false,superPending=false,ultraPending=false,testResult='';const rarityClass=r=>'rarity-'+String(r||'Common').toLowerCase();function save(){state.found=[...found];localStorage.setItem('rngRollState',JSON.stringify(state))}function prettyOdds(n){if(n<1000)return n.toLocaleString();if(n>=1e9)return(n/1e9).toLocaleString(undefined,{maximumFractionDigits:0})+'B';if(n>=1e6)return(n/1e6).toLocaleString(undefined,{maximumFractionDigits:0})+'M';if(n>=1e3)return(n/1e3).toLocaleString(undefined,{maximumFractionDigits:0})+'K';return n.toLocaleString()}
function updateUI(){const mult=(superPending?5:1)*(ultraPending?20:1),el=$('#multiplier');el.textContent=mult.toFixed(1)+'×';el.className='multiplier'+(mult===100?' combo-active':superPending?' super-active':ultraPending?' ultra-active':'');$('#totalRolls').textContent=state.total;$('#rollBadge').textContent='TOTAL '+state.total;$('#superOwned').textContent=state.super+' stored'+(superPending?' · READY':'');$('#ultraOwned').textContent=state.ultra+' stored'+(ultraPending?' · READY':'');$('#superNext').textContent=`Next Super: ${state.total%5}/5`;$('#ultraNext').textContent=`Next Ultra: ${state.total%25}/25`;$('#superBar').style.width=(state.total%5*20)+'%';$('#ultraBar').style.width=(state.total%25*4)+'%';$('#collectionProgress').textContent=Math.round(found.size/items.length*100)+'%';$('#foundCount').textContent=`Found: ${found.size} / ${items.length}`;const eq=items.find(x=>x.id===state.equipped);$('#equippedName').textContent=eq?.name||'NONE';$('#equippedName').className='equipped-name '+(eq?rarityClass(eq.rarity):'');$('#useSuper').disabled=state.super<1||superPending||rolling;$('#useUltra').disabled=state.ultra<1||ultraPending||rolling;$('#useSuper').textContent=superPending?'READY · 5×':'USE 5×';$('#useUltra').textContent=ultraPending?'READY · 20×':'USE 20×';$('#autoSuper').classList.toggle('on',state.autoSuper);$('#autoUltra').classList.toggle('on',state.autoUltra);$('#fastDetail').textContent=state.fastUnlocked?'Permanently unlocked · 1,200 ms':`Unlocks at 500 rolls · ${Math.max(0,500-state.total)} to go`;$('#fastToggle').disabled=!state.fastUnlocked;$('#fastToggle').textContent=!state.fastUnlocked?'LOCKED':state.fastEnabled?'FAST ON':'FAST OFF';$('#fastToggle').classList.toggle('unlocked',state.fastUnlocked);$('#fastToggle').classList.toggle('active',state.fastEnabled);$('#modeBadge').textContent=state.fastEnabled?'FAST':'NORMAL'}
function effectiveLuck(){return(superPending?5:1)*(ultraPending?20:1)}function pickItem(){if(testResult){const forced=items.find(i=>i.name===testResult);testResult='';$('#testSelect').value='';if(forced)return forced}const luck=effectiveLuck(),weights=rarityInfo.map((r,index)=>r[2]*Math.pow(luck,index*.42)),sum=weights.reduce((a,b)=>a+b,0);let ticket=Math.random()*sum,index=0;for(;index<weights.length-1;index++){ticket-=weights[index];if(ticket<=0)break}const tier=rarityInfo[index][0],pool=items.filter(i=>i.rarity===tier);return pool[Math.floor(Math.random()*pool.length)]}
function themeFor(item){const n=item.name.toLowerCase();if(/frost|glacier|frozen|ice|snow/.test(n))return'Frost';if(/galaxy|star|cosmic|astral|nebula|comet|solar|lunar/.test(n))return'Galaxy';if(/ember|crimson|phoenix|fire|sun/.test(n))return'Fire';if(/void|shadow|dusk|eclipse|obsidian/.test(n))return'Void';return item.rarity}
function renderCollection(){const grid=$('#collectionGrid'),filter=$('#collectionFilter').value;grid.innerHTML='';for(const [rarity,color] of rarityInfo){if(filter!=='All'&&filter!==rarity)continue;const heading=document.createElement('div');heading.className='collection-section';heading.style.color=color;heading.textContent=rarity;grid.appendChild(heading);for(const item of items.filter(x=>x.rarity===rarity)){const owned=found.has(item.id),card=document.createElement('button');card.type='button';card.className='item-card'+(!owned?' locked':'')+(state.equipped===item.id?' equipped':'');card.innerHTML=`<small style="color:${item.color}">${item.rarity}</small><strong class="${rarityClass(item.rarity)}">${owned?item.name:'???'}</strong>`;card.disabled=!owned;if(owned)card.onclick=()=>equip(item);grid.appendChild(card)}}}
function makeRow(item){const row=document.createElement('div');row.className='row';row.dataset.rarity=item.rarity;row.dataset.theme=themeFor(item);row.dataset.item=item.id;row.style.setProperty('--outline',document.documentElement.dataset.theme==='dark'?'#fff':'#111');row.innerHTML=`<div class="name ${rarityClass(item.rarity)}">${item.name}</div><div class="rarity">${item.rarity}</div>`;return row}
function renderTrack(target){const fragment=document.createDocumentFragment(),rows=[];for(let i=0;i<64;i++){let item;if(i===58)item=target;else{const roll=Math.random(),tier=roll<.68?'Common':roll<.93?'Uncommon':roll<.985?'Rare':roll<.997?'Epic':roll<.9995?'Legendary':roll<.99995?'Mythic':'Divine',pool=items.filter(x=>x.rarity===tier);item=pool[Math.floor(Math.random()*pool.length)]}rows.push(item);fragment.appendChild(makeRow(item))}roulette.replaceChildren(fragment);return rows}
function particles(color,count=30){const holder=$('#effects'),x=innerWidth/2,y=innerHeight/2;for(let i=0;i<count;i++){const p=document.createElement('i');p.className='particle';p.style.left=x+'px';p.style.top=y+'px';p.style.color=color;p.style.background=color;p.style.setProperty('--x',(Math.random()*innerWidth-innerWidth/2)+'px');p.style.setProperty('--y',(Math.random()*innerHeight-innerHeight/2)+'px');holder.appendChild(p);setTimeout(()=>p.remove(),2100)}}
function rareSuspense(item){return new Promise(resolve=>{const layer=document.createElement('div');layer.className='chaos-layer';layer.style.setProperty('--rarity-color',item.color);const title=document.createElement('div');title.className='odds-title';title.textContent=item.rarity.toUpperCase()+' AURA DETECTED';const counter=document.createElement('div');counter.className='odds-counter';counter.textContent='1 in 1';const caption=document.createElement('div');caption.className='odds-caption';caption.textContent='THE WORLD HOLDS ITS BREATH';const shock=document.createElement('div');shock.className='odds-shock';layer.append(title,counter,caption,shock);const colors=[item.color,'#fff','#ffcf33','#59e5ff','#f264ff'];for(let i=0;i<55;i++){const p=document.createElement('i');p.className='odds-spark';p.style.setProperty('--c',colors[i%colors.length]);p.style.setProperty('--size',(2+Math.random()*7)+'px');p.style.setProperty('--dx',(Math.random()*innerWidth-innerWidth/2)+'px');p.style.setProperty('--dy',(Math.random()*innerHeight-innerHeight/2)+'px');p.style.setProperty('--dur',(1.2+Math.random()*2)+'s');layer.appendChild(p)}$('#effects').appendChild(layer);const target=item.odds,start=performance.now(),duration=5000;let raf;function tick(now){const t=Math.min(1,(now-start)/duration),ease=t*t*(3-2*t),value=Math.max(1,Math.floor(Math.exp(Math.log(target)*ease));counter.textContent='1 in '+prettyOdds(value);if(t<1)raf=requestAnimationFrame(tick);else{counter.textContent='1 in '+prettyOdds(target);setTimeout(()=>{layer.classList.add('suspense-exit');setTimeout(()=>{layer.remove();resolve()},650)},350)}}raf=requestAnimationFrame(tick)})}
function comboSplash(){const layer=document.createElement('div');layer.className='luck-flash';layer.innerHTML='<div><small>SUPER + ULTRA BOOST</small>100× LUCK</div>';document.body.appendChild(layer);setTimeout(()=>layer.remove(),2200);particles('#d95cff',90)}function boostSplash(mult){if(mult===100){comboSplash();return}const el=document.createElement('div');el.className='reveal';el.innerHTML=`<span>BOOST ARMED</span>${mult}× LUCK`;$('#effects').appendChild(el);setTimeout(()=>el.remove(),2500);particles(mult===5?'#35d9a1':'#a478ff',40)}
function prepareAutomaticBoosts(){let changed=false;if(state.autoSuper&&!superPending&&state.super>0){state.super--;superPending=true;changed=true}if(state.autoUltra&&!ultraPending&&state.ultra>0){state.ultra--;ultraPending=true;changed=true}if(changed){save();updateUI()}}
async function roll(){if(rolling)return;rolling=true;prepareAutomaticBoosts();updateUI();$('#rollBtn').disabled=true;$('#app').classList.add('rolling');$('#rollerWrap').classList.add('rolling');const item=pickItem(),rows=renderTrack(item),h=94,index=58,center=$('#roller').clientHeight/2-h/2,finish=center-index*h,start=finish-64*h,duration=state.fastEnabled?1200:2500;roulette.style.transition='none';roulette.style.transform=`translateY(${start}px)`;void roulette.offsetWidth;roulette.style.transition=`transform ${duration}ms cubic-bezier(.045,.65,.1,1)`;roulette.style.transform=`translateY(${finish}px)`;const ticker=setInterval(()=>{if(!rolling){clearInterval(ticker);return}const streak=document.createElement('div');streak.className='reel-streak';streak.style.top=(10+Math.random()*80)+'%';$('#rollerWrap').appendChild(streak);setTimeout(()=>streak.remove(),520)},110);$('#rollerWrap').animate([{filter:'brightness(1)'},{filter:'brightness(.8)',offset:.18},{filter:'brightness(1.04)',offset:.9},{filter:'brightness(1.12)'}],{duration,easing:'ease-out'});await new Promise(r=>setTimeout(r,duration));clearInterval(ticker);$('#app').classList.remove('rolling');$('#rollerWrap').classList.remove('rolling');const targetRow=roulette.querySelector(`[data-item="${item.id}"]`);if(targetRow)targetRow.classList.add('row-result');if(item.rarity==='Mythic'||item.rarity==='Divine'){await rareSuspense(item)}else{await new Promise(r=>setTimeout(r,140))}rolling=false;$('#rollBtn').disabled=false;found.add(item.id);const rank=r=>rarityInfo.findIndex(x=>x[0]===r);if(!state.best||rank(item.rarity)>rank(state.best.rarity))state.best=item;state.total++;if(state.total%5===0)state.super++;if(state.total%25===0)state.ultra++;if(state.total>=500)state.fastUnlocked=true;save();$('#bestRoll').textContent=state.best?.name||'—';updateUI();renderCollection();particles(item.color,item.rarity==='Legendary'?70:item.rarity==='Epic'?45:18);if(auto)setTimeout(roll,450)}
function equip(item){state.equipped=item.id;save();updateUI();renderCollection();$('#equippedName').animate([{opacity:0,transform:'translateY(8px)'},{opacity:1,transform:'translateY(0)'}],{duration:420})}
$('#openDrawer').onclick=()=>$('#drawer').classList.add('open');$('#closeDrawer').onclick=()=>$('#drawer').classList.remove('open');$('#rollBtn').onclick=roll;$('#collectionFilter').onchange=renderCollection;
$('#useSuper').onclick=()=>{if(state.super<1||superPending||rolling)return;state.super--;superPending=true;save();updateUI();boostSplash(effectiveLuck())};$('#useUltra').onclick=()=>{if(state.ultra<1||ultraPending||rolling)return;state.ultra--;ultraPending=true;save();updateUI();boostSplash(effectiveLuck())};
$('#autoSuper').onclick=()=>{state.autoSuper=!state.autoSuper;if(state.autoSuper&&state.super>0&&!superPending){state.super--;superPending=true;boostSplash(effectiveLuck())}save();updateUI()};$('#autoUltra').onclick=()=>{state.autoUltra=!state.autoUltra;if(state.autoUltra&&state.ultra>0&&!ultraPending){state.ultra--;ultraPending=true;boostSplash(effectiveLuck())}save();updateUI()};
$('#autoSwitch').onclick=e=>{auto=!auto;e.currentTarget.classList.toggle('on',auto);if(auto&&!rolling)setTimeout(roll,250)};$('#fastToggle').onclick=()=>{if(!state.fastUnlocked)return;state.fastEnabled=!state.fastEnabled;save();updateUI()};$('#themeSwitch').onclick=e=>{const dark=document.documentElement.dataset.theme!=='dark';document.documentElement.dataset.theme=dark?'dark':'light';e.currentTarget.classList.toggle('on',dark);$('#themeLabel').textContent=dark?'DARK MODE':'LIGHT MODE';localStorage.setItem('rngTheme',dark?'dark':'light')};if(localStorage.getItem('rngTheme')==='dark'){document.documentElement.dataset.theme='dark';$('#themeSwitch').classList.add('on');$('#themeLabel').textContent='DARK MODE'}
document.querySelectorAll('.tab').forEach(button=>button.onclick=()=>{document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t===button));document.querySelectorAll('.tab-content').forEach(c=>c.classList.toggle('active',c.id===button.dataset.tab))});$('#addSuper').onclick=()=>{state.super++;save();updateUI()};$('#addUltra').onclick=()=>{state.ultra++;save();updateUI()};$('#setRollAmount').onclick=()=>{state.total=Math.max(0,Math.floor(Number($('#rollAmount').value)||0));if(state.total>=500)state.fastUnlocked=true;save();updateUI()};
for(const r of rarityInfo)$('#collectionFilter').add(new Option(r[0],r[0]));for(const item of items)$('#testSelect').add(new Option(`${item.rarity} — ${item.name} · 1 in ${prettyOdds(item.odds)}`,item.name));$('#testSelect').onchange=e=>testResult=e.target.value;renderCollection();updateUI();$('#bestRoll').textContent=state.best?.name||'—';
</script>
