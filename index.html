<style>

.roller-wrap{height:min(82vh,840px);position:relative;border-radius:25px;padding:12px;background:var(--roller);border:1px solid var(--line);box-shadow:0 26px 70px #141b2e2e;overflow:hidden}.roller-wrap:before,.roller-wrap:after{content:"";position:absolute;inset-block:0;width:13px;z-index:5;background:#59636d2b;pointer-events:none}.roller-wrap:before{left:0}.roller-wrap:after{right:0}.roller{position:absolute;inset:12px;overflow:hidden;border-radius:17px;background:var(--roller);border:1px solid var(--line)}.roulette{position:absolute;inset:0 auto auto;width:100%;will-change:transform}.row{height:94px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;position:relative;overflow:hidden}.row .name{font-size:clamp(18px,1.8vw,23px);font-weight:950}.row .rarity{font-size:9px;font-weight:950;letter-spacing:.2em;text-transform:uppercase;margin-top:5px}.rarity-common{color:#7d858d}.rarity-uncommon{color:#39b77d}.rarity-rare{color:#4c88db}.rarity-epic{color:#9857cf}.rarity-legendary{color:#d89d25}.rarity-mythic{color:#e14654}.rarity-divine{color:#ff50bf}.row[data-rarity=Rare] .name{font-family:Georgia,serif;font-style:italic;text-shadow:0 0 14px #4c88db77}.row[data-rarity=Epic] .name{font-family:Georgia,serif;font-style:italic;text-shadow:0 0 18px #9857cf99}.row[data-rarity=Legendary] .name{font-family:Georgia,serif;font-variant:small-caps;text-shadow:0 0 20px #d89d2599}.row[data-rarity=Mythic] .name{font-family:Georgia,serif;font-style:italic;text-shadow:2px 0 #f0f,-2px 0 #0ff;animation:glitch 1s infinite}.row[data-rarity=Divine] .name{font-family:Georgia,serif;font-variant:small-caps;color:#ff50bf;text-shadow:0 0 25px #b849ff;animation:divine 1.3s infinite alternate}.row[data-theme=Frost]{box-shadow:inset 0 0 25px #70d2ff55;background:linear-gradient(90deg,transparent,#70d2ff16,transparent)}.row[data-theme=Frost]:before{content:"❄  ✧  ❄";position:absolute;right:9px;top:7px;color:#8ce5ff;animation:snow 2s infinite}.row[data-theme=Galaxy]{background:linear-gradient(110deg,#9a5dff22,#348eff22,#e752d322);background-size:220%;animation:galaxy 3s infinite linear}.row[data-theme=Fire]{background:linear-gradient(0deg,#ff6f2833,transparent 80%)}.row[data-theme=Void]{background:radial-gradient(ellipse,#6644b544,transparent 70%)}.marker{position:absolute;z-index:8;inset-inline:12px;top:50%;height:94px;transform:translateY(-50%);border-block:2px solid #71808e55;pointer-events:none}.rolling .marker{border:3px solid transparent;animation:outline .35s infinite}.roller-glass{position:absolute;inset:12px;border-radius:18px;z-index:7;pointer-events:none;background:linear-gradient(180deg,#ffffff32,transparent 16%,transparent 84%,#0000000a)}.roller-wrap.rolling:after{content:"";position:absolute;inset:8% 12px;z-index:6;pointer-events:none;background:repeating-linear-gradient(180deg,transparent 0 24px,#ffffff24 25px 28px,transparent 29px 50px);animation:speed .5s infinite}.topbar{position:absolute;z-index:12;top:23px;left:24px;right:24px;display:flex;justify-content:space-between;pointer-events:none}.topbar div{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:7px 10px;font-size:10px;font-weight:950}
.equipped,.auto,.theme-panel,.fast-panel{padding:13px}.equipped-name{font-size:22px;font-weight:950;margin-top:7px;min-height:28px;overflow-wrap:anywhere}.stats{padding:9px 15px}.stat-row{height:34px;border-bottom:1px solid var(--line);font-size:12px}.stat-row:last-child{border:0}.switch{width:56px;height:30px;border:0;border-radius:99px;background:var(--track);padding:3px;cursor:pointer}.switch i{display:block;width:24px;height:24px;border-radius:50%;background:#aab1b8;transition:.3s}.switch.on{background:#36d39944}.switch.on i{transform:translateX(26px);background:#36d399}.fast-panel{display:flex;align-items:center;justify-content:space-between}.fast-label{font-size:12px;font-weight:900}.fast-toggle{height:31px;border:1px solid var(--line);border-radius:9px;background:var(--track);padding:0 9px;font-size:10px;font-weight:950;cursor:pointer}.fast-toggle.active{background:#28b17d;color:white}.test-panel{margin-top:auto;padding:11px}.tabs{display:flex;gap:5px;background:var(--track);border-radius:10px;padding:3px;margin:7px 0}.tab{flex:1;border:0;border-radius:8px;padding:6px;background:transparent;font-size:9px;font-weight:950;cursor:pointer}.tab.active{background:var(--panel)}.tab-content{display:none}.tab-content.active{display:block}.test-panel select{width:100%;height:32px;background:var(--track);border:1px solid var(--line);border-radius:8px;font-size:10px}.dev-actions,.amount-controls{display:flex;gap:5px;margin-top:6px}.dev-actions button,.amount-controls button{flex:1;min-height:30px;border:0;border-radius:8px;background:#e8e1ff;color:#6949cb;font-size:10px;font-weight:900;cursor:pointer}.amount-controls input{width:100%;min-width:0;background:var(--track);border:1px solid var(--line);border-radius:8px;padding:4px}
.drawer{position:fixed;z-index:40;inset:0 auto 0 0;width:min(410px,94vw);background:var(--drawer);box-shadow:25px 0 70px #0003;transform:translateX(-105%);transition:transform .55s cubic-bezier(.2,.9,.25,1.1);padding:21px;border-right:1px solid var(--line)}.drawer.open{transform:translateX(0)}.drawer-head{display:flex;justify-content:space-between;align-items:center}.drawer h2{margin:5px 0}.close{border:0;width:38px;height:38px;border-radius:12px;background:var(--track);cursor:pointer;font-size:20px}.collection-filter{width:100%;height:34px;margin-top:10px;background:var(--track);border:1px solid var(--line);border-radius:9px}.collection-grid{height:calc(100vh - 140px);overflow:auto;display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px 4px 26px}.collection-section{grid-column:1/-1;margin-top:12px;padding:7px 3px;border-bottom:1px solid var(--line);font-size:11px;font-weight:950;letter-spacing:.16em;text-transform:uppercase}.item-card{height:80px;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:9px;cursor:pointer}.item-card.locked{filter:grayscale(1);opacity:.4}.item-card.equipped{border:2px solid #ef4444;box-shadow:0 0 18px #ef444455}.item-card strong{display:block;margin-top:19px;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.item-card small{float:right;font-size:8px;font-weight:950}
.effects{position:fixed;inset:0;z-index:35;pointer-events:none;overflow:hidden}.particle{position:absolute;width:7px;height:7px;border-radius:50%;box-shadow:0 0 18px currentColor;animation:particle 2s forwards}.chaos-layer{position:fixed;inset:0;z-index:45;background:#05030a;overflow:hidden;pointer-events:all;animation:fadeIn .45s both}.chaos-layer:before{content:"";position:absolute;inset:-40%;background:conic-gradient(transparent,#ff216f77,transparent,#764cff99,transparent,#31eaff88,transparent,#ffe74777,transparent);filter:blur(24px);animation:spin 4s linear infinite}.chaos-layer:after{content:"";position:absolute;inset:0;background:radial-gradient(circle,transparent 2%,#030209 90%);animation:pulse 1s infinite alternate}.odds-title,.odds-counter,.odds-caption{position:absolute;z-index:3;left:50%;transform:translateX(-50%);text-align:center;white-space:nowrap}.odds-title{top:26%;font-size:clamp(12px,2vw,20px);font-weight:950;letter-spacing:.34em;color:#fff;text-shadow:0 0 20px var(--rarity-color)}.odds-counter{top:39%;font-size:clamp(42px,10vw,112px);font-weight:1000;font-variant-numeric:tabular-nums;letter-spacing:-.06em;color:#fff;text-shadow:0 0 15px #fff,0 0 42px var(--rarity-color),0 0 90px var(--rarity-color);animation:counterGlow .8s infinite alternate}.odds-caption{top:58%;font-size:clamp(10px,1.6vw,16px);font-weight:900;letter-spacing:.3em;color:#eef}.odds-spark{position:absolute;z-index:2;left:50%;top:50%;width:var(--size);height:var(--size);border-radius:50%;background:var(--c);box-shadow:0 0 20px var(--c);animation:spark var(--dur) ease-out forwards}.odds-ring{position:absolute;z-index:2;left:50%;top:50%;width:10vw;height:10vw;border:3px solid var(--rarity-color);border-radius:50%;transform:translate(-50%,-50%);animation:ring 1.7s ease-out infinite}.suspense-exit{animation:fadeOut .6s forwards!important}.luck-flash{position:fixed;inset:0;z-index:60;display:grid;place-items:center;background:#05030aee;color:#fff;font-size:clamp(54px,13vw,150px);font-weight:1000;text-align:center;text-shadow:0 0 20px #fff,0 0 60px #ffdc39,0 0 120px #d93bff;animation:luckFlash 2s forwards;pointer-events:none}.luck-flash small{display:block;font-size:12px;letter-spacing:.35em;margin-bottom:16px}.row-result{outline:3px solid var(--outline);outline-offset:-5px}.reel-streak{position:absolute;z-index:10;left:0;right:0;height:90px;pointer-events:none;background:linear-gradient(90deg,transparent,#ffffffbb,transparent);animation:streak .5s forwards}
@keyframes breathe{50%{transform:scale(1.04);text-shadow:0 0 32px #8877ff66}}@keyframes speed{50%{opacity:.65}}@keyframes outline{50%{border-color:var(--ink);box-shadow:0 0 0 2px var(--bg)}}@keyframes particle{to{transform:translate(var(--x),var(--y)) rotate(720deg) scale(.1);opacity:0}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes fadeIn{from{opacity:0}to{opacity:1}}@keyframes fadeOut{to{opacity:0;visibility:hidden}}@keyframes pulse{to{opacity:.3}}@keyframes counterGlow{to{filter:hue-rotate(70deg) brightness(1.6);transform:translateX(-50%) scale(1.04)}}@keyframes ring{to{width:100vmax;height:100vmax;opacity:0}}@keyframes spark{to{transform:translate(var(--dx),var(--dy)) scale(.1) rotate(540deg);opacity:0}}@keyframes luckFlash{0%{opacity:0;transform:scale(.3) rotate(-8deg)}20%{opacity:1;transform:scale(1.07) rotate(2deg)}35%{transform:scale(1)}85%{opacity:1}100%{opacity:0;transform:scale(1.2)}}@keyframes glitch{50%{transform:translateX(1px);text-shadow:-3px 0 #f0f,3px 0 #0ff}}@keyframes divine{to{filter:hue-rotate(130deg) brightness(1.6)}}@keyframes snow{to{transform:translateY(17px);opacity:.2}}@keyframes galaxy{to{background-position:220% 0}}@keyframes streak{from{transform:translateX(-120%) skewX(-20deg);opacity:0}35%{opacity:.9}to{transform:translateX(120%) skewX(-20deg);opacity:0}}@keyframes spark{to{transform:translate(var(--dx),var(--dy)) scale(.1) rotate(540deg);opacity:0}}
@media(max-width:1050px){body{overflow:auto}.app{height:auto;min-height:100vh;grid-template-columns:minmax(285px,42vw) minmax(220px,28vw);gap:15px;padding:16px}.left{grid-row:2}.right{grid-column:2;grid-row:1/span 2}.roller-wrap{grid-column:1;grid-row:1;height:76vh;min-height:550px}.left,.right{height:auto}.right{align-self:center}.test-panel{margin-top:0}}@media(max-width:700px){body{overflow:auto}.app{display:flex;flex-direction:column;padding:13px;gap:12px}.roller-wrap{order:1;width:min(94vw,440px);height:62vh;min-height:440px}.right{order:2;width:min(94vw,440px)}.left{order:3;width:min(94vw,440px)}.test-panel{margin-top:0}}

<body>
<div class="effects" id="effects"></div><div class="drawer" id="drawer"><div class="drawer-head"><div><div class="eyebrow">YOUR VAULT</div><h2 id="foundCount">Found: 0 / 250</h2></div><button class="close" id="closeDrawer">×</button></div><select class="collection-filter" id="collectionFilter"><option value="All">All rarities</option></select><div class="collection-grid" id="collectionGrid"></div></div>
<div class="app" id="app"><aside class="left"><button class="collection-btn" id="openDrawer">◆ &nbsp; COLLECTION</button><section class="panel luck"><div class="eyebrow">LUCK MULTIPLIER</div><div class="multiplier" id="multiplier">1.0×</div></section>
<section class="panel boost"><div class="boost-head"><span class="boost-name">SUPER ROLL</span><span class="boost-owned" id="superOwned">0 stored</span></div><div class="progress"><i id="superBar"></i></div><div class="boost-foot"><span class="eyebrow" id="superNext">Next Super: 0/5</span><div class="boost-controls"><button class="auto-use" id="autoSuper">AUTO USE</button><button class="use super" id="useSuper">USE 5×</button></div></div></section>
<section class="panel boost"><div class="boost-head"><span class="boost-name">ULTRA ROLL</span><span class="boost-owned" id="ultraOwned">0 stored</span></div><div class="progress"><i id="ultraBar"></i></div><div class="boost-foot"><span class="eyebrow" id="ultraNext">Next Ultra: 0/25</span><div class="boost-controls"><button class="auto-use" id="autoUltra">AUTO USE</button><button class="use ultra" id="useUltra">USE 20×</button></div></div></section></aside>
<main class="roller-wrap" id="rollerWrap"><div class="topbar"><div id="rollBadge">TOTAL 0</div><div id="modeBadge">NORMAL</div></div><div class="roller" id="roller"><div class="roulette" id="roulette"></div></div><div class="marker"></div><div class="roller-glass"></div></main>
<aside class="right"><section class="panel equipped"><div class="eyebrow">EQUIPPED</div><div class="equipped-name" id="equippedName">NONE</div></section><section class="panel stats"><div class="stat-row"><span>Total Rolls</span><b id="totalRolls">0</b></div><div class="stat-row"><span>Collection Progress</span><b id="collectionProgress">0%</b></div><div class="stat-row"><span>Best Roll</span><b id="bestRoll">—</b></div></section><section class="panel auto"><div class="right-head"><div class="eyebrow">AUTO ROLL</div><button class="switch" id="autoSwitch"><i></i></button></div></section><section class="panel theme-panel"><div class="right-head"><div><div class="eyebrow">APPEARANCE</div><div class="fast-detail" id="themeLabel">LIGHT MODE</div></div><button class="switch" id="themeSwitch"><i></i></button></div></section><section class="panel fast-panel"><div><span class="fast-label">FAST ROLL</span><span class="fast-detail" id="fastDetail"></span></div><button class="fast-toggle" id="fastToggle">LOCKED</button></section><button class="roll-btn" id="rollBtn">ROLL</button>
<section class="panel test-panel"><div class="eyebrow">DEVELOPER TOOLS</div><div class="tabs"><button class="tab active" data-tab="testTab">ROLL TEST</button><button class="tab" data-tab="boostTab">BOOST LAB</button></div><div class="tab-content active" id="testTab"><select id="testSelect"><option value="">Random result</option></select><div class="fast-detail">Ordered common → divine</div></div><div class="tab-content" id="boostTab"><div class="dev-actions"><button id="addSuper">+1 Super</button><button id="addUltra">+1 Ultra</button></div><div class="amount-controls"><input id="rollAmount" type="number" min="0" step="1" placeholder="Set total rolls"><button id="setRollAmount">SET</button></div></div></section></aside></div>
<script>
const rarityInfo=[['Common','#7d858d',92],['Uncommon','#39b77d',7],['Rare','#4c88db',.9],['Epic','#9857cf',.09],['Legendary','#d89d25',.009],['Mythic','#e14654',.00005],['Divine','#ea66b6',.0000001]],odds={Common:1,Uncommon:2,Rare:18,Epic:100,Legendary:2000,Mythic:20000,Divine:1000000000};
const prefixes=['Stone','Cloud','Shadow','Solar','Void','Crystal','Frost','Phantom','Nova','Prism','Iron','Nebula','Ghost','Lunar','Storm','Galaxy','Quantum','Core','Aether','Omega','Ember','Glacier','Astral','Dusk','Radiant','Runic','Cosmic','Eclipse','Sapphire','Crimson','Silver','Golden','Frozen','Celestial','Arcane','Starlit','Obsidian','Tempest','Dream','Aurora'],suffixes=['Fragment','Shard','Crown','Vessel','Pulse','Wing','Core','Relic','Sigil','King','Blade','Orb','Star','Heart','Titan','Emperor','Dragon','God','Void','Genesis','Prism','Beacon','Warden','Lantern','Comet','Golem','Monarch','Talisman','Bloom','Mirage','Sentinel','Phoenix','Catalyst','Harbinger','Reverie','Sovereign','Bastion','Seraph','Enigma','Eternity'];
const counts=[35,35,45,45,40,30,20],divine=['Divine King','Eternal Zero','Rainbow Apex','Celestial Crown'],items=[],names=new Set();let id=0;for(let r=0;r<7;r++)for(let i=0;i<counts[r];i++){const rarity=rarityInfo[r][0];let name=rarity==='Divine'?divine[i%4]:`${prefixes[(i*7+r*11)%prefixes.length]} ${suffixes[(i*13+r*17)%suffixes.length]}`;if(names.has(name))name+=` ${i+1}`;names.add(name);items.push({id:id++,name,rarity,color:rarityInfo[r][1],odds:odds[rarity]*counts[r]})}
const $=s=>document.querySelector(s),roulette=$('#roulette');let previous={};try{previous=JSON.parse(localStorage.getItem('rngRollState')||'{}')||{}}catch{}const state={total:0,super:0,ultra:0,equipped:null,best:null,found:[],fastUnlocked:false,fastEnabled:false,autoSuper:false,autoUltra:false,...previous};state.found=Array.isArray(state.found)?state.found:[];state.fastUnlocked=Boolean(state.fastUnlocked||state.total>=500);state.fastEnabled=Boolean(state.fastEnabled&&state.fastUnlocked);let found=new Set(state.found),rolling=false,auto=false,superPending=false,ultraPending=false,testResult='';const cls=r=>'rarity-'+String(r||'Common').toLowerCase();function save(){state.found=[...found];localStorage.setItem('rngRollState',JSON.stringify(state))}function pretty(n){return n>=1e9?(n/1e9)+'B':n>=1e6?(n/1e6)+'M':n>=1e3?(n/1e3)+'K':n.toLocaleString()}
function update(){const mult=(superPending?5:1)*(ultraPending?20:1),m=$('#multiplier');m.textContent=mult.toFixed(1)+'×';$('#totalRolls').textContent=state.total;$('#rollBadge').textContent='TOTAL '+state.total;$('#superOwned').textContent=state.super+' stored'+(superPending?' · READY':'');$('#ultraOwned').textContent=state.ultra+' stored'+(ultraPending?' · READY':'');$('#superNext').textContent=`Next Super: ${state.total%5}/5`;$('#ultraNext').textContent=`Next Ultra: ${state.total%25}/25`;$('#superBar').style.width=(state.total%5*20)+'%';$('#ultraBar').style.width=(state.total%25*4)+'%';$('#collectionProgress').textContent=Math.round(found.size/items.length*100)+'%';$('#foundCount').textContent=`Found: ${found.size} / ${items.length}`;const eq=items.find(x=>x.id===state.equipped);$('#equippedName').textContent=eq?.name||'NONE';$('#equippedName').className='equipped-name '+(eq?cls(eq.rarity):'');$('#useSuper').disabled=state.super<1||superPending||rolling;$('#useUltra').disabled=state.ultra<1||ultraPending||rolling;$('#autoSuper').classList.toggle('on',state.autoSuper);$('#autoUltra').classList.toggle('on',state.autoUltra);$('#fastDetail').textContent=state.fastUnlocked?'Permanently unlocked · 1,200 ms':`Unlocks at 500 rolls · ${Math.max(0,500-state.total)} to go`;$('#fastToggle').disabled=!state.fastUnlocked;$('#fastToggle').textContent=!state.fastUnlocked?'LOCKED':state.fastEnabled?'FAST ON':'FAST OFF';$('#fastToggle').classList.toggle('active',state.fastEnabled);$('#modeBadge').textContent=state.fastEnabled?'FAST':'NORMAL'}
function luck(){return(superPending?5:1)*(ultraPending?20:1)}function choose(){if(testResult){const item=items.find(x=>x.name===testResult);testResult='';$('#testSelect').value='';if(item)return item}const weights=rarityInfo.map((r,i)=>r[2]*Math.pow(luck(),i*.42)),sum=weights.reduce((a,b)=>a+b,0);let n=Math.random()*sum,i=0;for(;i<weights.length-1;i++){n-=weights[i];if(n<=0)break}const pool=items.filter(x=>x.rarity===rarityInfo[i][0]);return pool[Math.floor(Math.random()*pool.length)]}
function theme(item){const n=item.name.toLowerCase();if(/frost|glacier|frozen|ice|snow/.test(n))return'Frost';if(/galaxy|star|cosmic|astral|nebula|comet|solar|lunar/.test(n))return'Galaxy';if(/ember|crimson|phoenix|fire|sun/.test(n))return'Fire';if(/void|shadow|dusk|eclipse|obsidian/.test(n))return'Void';return item.rarity}
function renderCollection(){const grid=$('#collectionGrid'),filter=$('#collectionFilter').value;grid.innerHTML='';for(const [rarity,color] of rarityInfo){if(filter!=='All'&&filter!==rarity)continue;const head=document.createElement('div');head.className='collection-section';head.style.color=color;head.textContent=rarity;grid.append(head);for(const item of items.filter(x=>x.rarity===rarity)){const owned=found.has(item.id),card=document.createElement('button');card.className='item-card'+(!owned?' locked':'')+(state.equipped===item.id?' equipped':'');card.innerHTML=`<small style="color:${item.color}">${item.rarity}</small><strong class="${cls(item.rarity)}">${owned?item.name:'???'}</strong>`;card.disabled=!owned;if(owned)card.onclick=()=>equip(item);grid.append(card)}}}
function row(item){const el=document.createElement('div');el.className='row';el.dataset.rarity=item.rarity;el.dataset.theme=theme(item);el.dataset.item=item.id;el.style.setProperty('--outline',document.documentElement.dataset.theme==='dark'?'#fff':'#111');el.innerHTML=`<div class="name ${cls(item.rarity)}">${item.name}</div><div class="rarity">${item.rarity}</div>`;return el}function renderTrack(target){const fragment=document.createDocumentFragment();for(let i=0;i<48;i++){let item;if(i===43)item=target;else{const x=Math.random(),tier=x<.68?'Common':x<.93?'Uncommon':x<.985?'Rare':x<.997?'Epic':x<.9995?'Legendary':x<.99995?'Mythic':'Divine',pool=items.filter(a=>a.rarity===tier);item=pool[Math.floor(Math.random()*pool.length)]}fragment.append(row(item))}roulette.replaceChildren(fragment)}
function sparks(layer,item){const colors=[item.color,'#fff','#ffcf33','#59e5ff','#f264ff'];for(let i=0;i<52;i++){const p=document.createElement('i');p.className='odds-spark';p.style.setProperty('--c',colors[i%colors.length]);p.style.setProperty('--size',(2+Math.random()*7)+'px');p.style.setProperty('--dx',(Math.random()*innerWidth-innerWidth/2)+'px');p.style.setProperty('--dy',(Math.random()*innerHeight-innerHeight/2)+'px');p.style.setProperty('--dur',(1.2+Math.random()*2)+'s');layer.append(p)}}function suspense(item){return new Promise(resolve=>{const layer=document.createElement('div');layer.className='chaos-layer';layer.style.setProperty('--rarity-color',item.color);const title=document.createElement('div');title.className='odds-title';title.textContent=item.rarity+' AURA DETECTED';const counter=document.createElement('div');counter.className='odds-counter';counter.textContent='1 in 1';const caption=document.createElement('div');caption.className='odds-caption';caption.textContent='THE WORLD HOLDS ITS BREATH';layer.append(title,counter,caption);for(let i=0;i<4;i++){const ring=document.createElement('i');ring.className='odds-ring';ring.style.animationDelay=(i*.35)+'s';layer.append(ring)}sparks(layer,item);document.body.append(layer);const target=item.odds,start=performance.now(),duration=5000;function tick(now){const t=Math.min(1,(now-start)/duration),ease=t*t*(3-2*t),value=Math.max(1,Math.floor(Math.exp(Math.log(target)*ease)));counter.textContent='1 in '+pretty(value);if(t<1)requestAnimationFrame(tick);else{counter.textContent='1 in '+pretty(target);setTimeout(()=>{layer.classList.add('suspense-exit');setTimeout(()=>{layer.remove();resolve()},650)},350)}}requestAnimationFrame(tick)})}
function particles(color,count){for(let i=0;i<count;i++){const p=document.createElement('i');p.className='particle';p.style.left=innerWidth/2+'px';p.style.top=innerHeight/2+'px';p.style.color=color;p.style.background=color;p.style.setProperty('--x',(Math.random()*innerWidth-innerWidth/2)+'px');p.style.setProperty('--y',(Math.random()*innerHeight-innerHeight/2)+'px');$('#effects').append(p);setTimeout(()=>p.remove(),2100)}}function boostSplash(){const mult=luck();if(mult===100){const box=document.createElement('div');box.className='luck-flash';box.innerHTML='<div><small>SUPER + ULTRA BOOST</small>100× LUCK</div>';document.body.append(box);setTimeout(()=>box.remove(),2100);particles('#d95cff',90)}else{const box=document.createElement('div');box.className='reveal';box.textContent=mult+'× LUCK READY';$('#effects').append(box);setTimeout(()=>box.remove(),2200)}}
function equip(item){state.equipped=item.id;save();update();renderCollection()}function useBoost(type){if(rolling)return;if(type==='super'&&state.super>0&&!superPending){state.super--;superPending=true}else if(type==='ultra'&&state.ultra>0&&!ultraPending){state.ultra--;ultraPending=true}else return;save();update();boostSplash()}function autoBoost(){let changed=false;if(state.autoSuper&&!superPending&&state.super>0){state.super--;superPending=true;changed=true}if(state.autoUltra&&!ultraPending&&state.ultra>0){state.ultra--;ultraPending=true;changed=true}if(changed){save();update();boostSplash()}}
async function roll(){if(rolling)return;rolling=true;autoBoost();update();$('#rollBtn').disabled=true;$('#app').classList.add('rolling');$('#rollerWrap').classList.add('rolling');const item=choose();renderTrack(item);const h=94,index=43,center=$('#roller').clientHeight/2-h/2,finish=center-index*h,start=finish-48*h,duration=state.fastEnabled?1200:2500;roulette.style.transition='none';roulette.style.transform=`translateY(${start}px)`;void roulette.offsetWidth;roulette.style.transition=`transform ${duration}ms cubic-bezier(.045,.65,.1,1)`;roulette.style.transform=`translateY(${finish}px)`;const streakTimer=setInterval(()=>{const s=document.createElement('i');s.className='reel-streak';s.style.top=(10+Math.random()*80)+'%';$('#rollerWrap').append(s);setTimeout(()=>s.remove(),520)},120);await new Promise(r=>setTimeout(r,duration));clearInterval(streakTimer);$('#app').classList.remove('rolling');$('#rollerWrap').classList.remove('rolling');const selected=roulette.querySelector(`[data-item="${item.id}"]`);if(selected)selected.classList.add('row-result');if(item.rarity==='Mythic'||item.rarity==='Divine')await suspense(item);rolling=false;$('#rollBtn').disabled=false;found.add(item.id);const rank=x=>rarityInfo.findIndex(r=>r[0]===x);if(!state.best||rank(item.rarity)>rank(state.best.rarity))state.best=item;state.total++;if(state.total%5===0)state.super++;if(state.total%25===0)state.ultra++;if(state.total>=500)state.fastUnlocked=true;superPending=false;ultraPending=false;save();$('#bestRoll').textContent=state.best?.name||'—';update();renderCollection();particles(item.color,item.rarity==='Legendary'?70:24);if(auto)setTimeout(roll,450)}
$('#openDrawer').onclick=()=>$('#drawer').classList.add('open');$('#closeDrawer').onclick=()=>$('#drawer').classList.remove('open');$('#rollBtn').onclick=roll;$('#collectionFilter').onchange=renderCollection;$('#useSuper').onclick=()=>useBoost('super');$('#useUltra').onclick=()=>useBoost('ultra');$('#autoSuper').onclick=()=>{state.autoSuper=!state.autoSuper;if(state.autoSuper&&state.super>0&&!superPending){state.super--;superPending=true;boostSplash()}save();update()};$('#autoUltra').onclick=()=>{state.autoUltra=!state.autoUltra;if(state.autoUltra&&state.ultra>0&&!ultraPending){state.ultra--;ultraPending=true;boostSplash()}save();update()};$('#autoSwitch').onclick=e=>{auto=!auto;e.currentTarget.classList.toggle('on',auto);if(auto&&!rolling)setTimeout(roll,250)};$('#fastToggle').onclick=()=>{if(state.fastUnlocked){state.fastEnabled=!state.fastEnabled;save();update()}};
$('#themeSwitch').onclick=e=>{const dark=document.documentElement.dataset.theme!=='dark';document.documentElement.dataset.theme=dark?'dark':'light';e.currentTarget.classList.toggle('on',dark);$('#themeLabel').textContent=dark?'DARK MODE':'LIGHT MODE';localStorage.setItem('rngTheme',dark?'dark':'light')};if(localStorage.getItem('rngTheme')==='dark'){document.documentElement.dataset.theme='dark';$('#themeSwitch').classList.add('on');$('#themeLabel').textContent='DARK MODE'}document.querySelectorAll('.tab').forEach(button=>button.onclick=()=>{document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t===button));document.querySelectorAll('.tab-content').forEach(c=>c.classList.toggle('active',c.id===button.dataset.tab))});$('#addSuper').onclick=()=>{state.super++;save();update()};$('#addUltra').onclick=()=>{state.ultra++;save();update()};$('#setRollAmount').onclick=()=>{state.total=Math.max(0,Math.floor(Number($('#rollAmount').value)||0));if(state.total>=500)state.fastUnlocked=true;save();update()};for(const r of rarityInfo)$('#collectionFilter').add(new Option(r[0],r[0]));for(const item of items)$('#testSelect').add(new Option(`${item.rarity} — ${item.name} · 1 in ${pretty(item.odds)}`,item.name));$('#testSelect').onchange=e=>testResult=e.target.value;renderCollection();update();$('#bestRoll').textContent=state.best?.name||'—';
</script></body></html>
