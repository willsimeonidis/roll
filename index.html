<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ROLL // RNG</title>
  <style>
    :root{--bg:#eceff2;--panel:#dfe3e7;--ink:#20242a;--muted:#7b8188;--red:#ef4444;--green:#36d399}
    *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow:hidden}
    button,select{font:inherit}.app{height:100vh;display:grid;grid-template-columns:270px minmax(360px,40vw) 270px;justify-content:center;align-items:center;gap:38px;padding:24px}
    .left,.right{height:min(760px,82vh);display:flex;flex-direction:column;gap:16px}.panel{background:rgba(255,255,255,.62);border:1px solid rgba(33,38,44,.07);border-radius:22px;box-shadow:0 16px 40px rgba(40,47,55,.08);backdrop-filter:blur(18px)}
    .luck{padding:20px}.eyebrow{font-size:11px;font-weight:850;letter-spacing:.22em;color:var(--muted)}.multiplier{font-size:64px;line-height:1;font-weight:900;letter-spacing:-.08em;margin:12px 0 4px}.boost{padding:16px}.boost-head,.stat-row{display:flex;align-items:center;justify-content:space-between}.boost-name{font-weight:850}.boost-owned{font-size:13px;color:var(--muted)}
    .progress{height:7px;border-radius:99px;background:#d8dde2;overflow:hidden;margin:10px 0}.progress i{display:block;height:100%;width:0;border-radius:inherit;background:var(--green);transition:width .45s cubic-bezier(.2,.8,.2,1)}
    .boost-foot{display:flex;align-items:center;justify-content:space-between}.use{border:0;border-radius:10px;padding:8px 12px;color:white;font-weight:900;cursor:pointer;transition:.18s transform,.18s filter}.use:hover{transform:translateY(-2px)}.use.super{background:#32c58d}.use.ultra{background:#775be8}.use:disabled{filter:grayscale(1);opacity:.45}
    .roller-wrap{position:relative;height:min(82vh,820px);width:100%;border-radius:26px;padding:12px;background:#d5dade;border:1px solid rgba(0,0,0,.06);box-shadow:0 24px 60px rgba(43,49,55,.16),inset 0 0 0 2px rgba(255,255,255,.35);overflow:hidden}
    .roller-wrap:before,.roller-wrap:after{content:"";position:absolute;top:0;bottom:0;width:16px;z-index:5;background:rgba(89,96,104,.18)}.roller-wrap:before{left:0}.roller-wrap:after{right:0}.roller{position:absolute;left:12px;right:12px;top:12px;bottom:12px;overflow:hidden;border-radius:18px;background:linear-gradient(150deg,#dfe3e7,#cfd4d9);border:1px solid rgba(0,0,0,.06)}
    .roulette{position:absolute;left:0;right:0;will-change:transform}.row{height:94px;border-bottom:1px solid rgba(0,0,0,.055);display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;color:#2b3035}.row .name{font-size:20px;font-weight:900;letter-spacing:.02em}.row .rarity{font-size:10px;font-weight:900;letter-spacing:.18em;text-transform:uppercase;margin-top:5px;opacity:.72}
    .marker{position:absolute;z-index:8;left:12px;right:12px;top:50%;height:94px;transform:translateY(-50%);border-top:2px solid rgba(35,39,43,.16);border-bottom:2px solid rgba(35,39,43,.16);pointer-events:none}.marker:before,.marker:after{content:"";position:absolute;top:50%;width:0;height:0;border-top:8px solid transparent;border-bottom:8px solid transparent}.marker:before{left:-1px;border-left:9px solid #343941}.marker:after{right:-1px;border-right:9px solid #343941}
    .roller-glass{position:absolute;inset:12px;border-radius:18px;z-index:7;pointer-events:none;background:linear-gradient(180deg,rgba(255,255,255,.3),transparent 20%,transparent 80%,rgba(0,0,0,.07))}
    .topbar{position:absolute;z-index:12;top:24px;left:26px;right:26px;display:flex;justify-content:space-between;pointer-events:none}.topbar div{background:rgba(255,255,255,.72);border:1px solid rgba(0,0,0,.05);border-radius:10px;padding:7px 10px;font-size:11px;font-weight:900;box-shadow:0 8px 20px rgba(0,0,0,.06)}
    .equipped{padding:18px}.equipped-name{font-size:26px;font-weight:950;letter-spacing:.02em;margin-top:8px;min-height:31px}.stats{padding:12px 18px}.stat-row{height:37px;border-bottom:1px solid rgba(0,0,0,.045);font-size:13px}.stat-row:last-child{border:0}.stat-row b{font-size:14px}
    .collection-btn{height:54px;border:0;border-radius:16px;background:#30353b;color:white;font-weight:900;cursor:pointer;box-shadow:0 12px 28px rgba(31,35,39,.16);transition:.2s}.collection-btn:hover{transform:translateY(-3px);box-shadow:0 16px 34px rgba(31,35,39,.22)}
    .drawer{position:fixed;z-index:30;top:0;bottom:0;left:0;width:min(390px,92vw);background:rgba(239,242,244,.96);backdrop-filter:blur(24px);box-shadow:25px 0 60px rgba(32,38,44,.18);transform:translateX(-105%);transition:transform .55s cubic-bezier(.2,.9,.25,1.15);padding:24px}.drawer.open{transform:translateX(0)}.drawer-head{display:flex;justify-content:space-between;align-items:center}.drawer h2{margin:0}.close{border:0;width:40px;height:40px;border-radius:12px;background:#dde1e5;cursor:pointer;font-size:20px}.collection-grid{height:calc(100vh - 100px);overflow-y:auto;display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:16px 5px 30px}.collection-grid::-webkit-scrollbar{width:7px}.collection-grid::-webkit-scrollbar-thumb{background:#aeb4ba;border-radius:99px}
    .item-card{height:92px;border:1px solid rgba(0,0,0,.06);border-radius:14px;background:white;padding:11px;position:relative;transition:.25s;cursor:pointer}.item-card.locked{filter:grayscale(1);opacity:.38}.item-card:hover{transform:scale(1.025)}.item-card.equipped{border:2px solid var(--red);box-shadow:0 0 22px rgba(239,68,68,.35);transform:scale(1.035)}.item-card strong{display:block;margin-top:22px;font-size:13px}.item-card small{position:absolute;right:9px;top:9px;font-size:9px;font-weight:900;text-transform:uppercase}
    .right-head{display:flex;align-items:flex-end;justify-content:space-between}.auto{padding:16px}.switch{width:64px;height:34px;border-radius:99px;border:0;background:#e2e5e8;cursor:pointer;padding:4px;transition:.25s}.switch i{display:block;width:26px;height:26px;border-radius:50%;background:#aab0b5;transition:.35s cubic-bezier(.2,.8,.2,1)}.switch.on{background:rgba(54,211,153,.22)}.switch.on i{transform:translateX(30px);background:#36d399;box-shadow:0 0 15px rgba(54,211,153,.8)}
    .roll-btn{height:68px;border:0;border-radius:18px;color:white;background:#252a30;font-size:16px;font-weight:950;letter-spacing:.12em;cursor:pointer;box-shadow:0 14px 30px rgba(31,35,40,.22);transition:.2s}.roll-btn:hover{transform:translateY(-3px);box-shadow:0 18px 38px rgba(31,35,40,.28)}.roll-btn:active{transform:scale(.97)}.roll-btn:disabled{opacity:.65}
    .test{margin-top:auto;padding:14px}.test select{width:100%;height:38px;border:0;border-radius:10px;background:#e6e9ec;padding:0 9px;color:#444b52}
    .effects{position:fixed;inset:0;pointer-events:none;z-index:20}.particle{position:absolute;width:5px;height:5px;border-radius:50%;animation:particle 1.4s cubic-bezier(.1,.7,.2,1) forwards}.reveal{position:absolute;z-index:25;left:50%;top:50%;transform:translate(-50%,-50%) scale(.7);font-size:clamp(36px,7vw,92px);font-weight:1000;letter-spacing:-.06em;opacity:0;text-align:center;text-shadow:0 12px 40px rgba(0,0,0,.14);animation:reveal 1.5s ease forwards}.reveal span{display:block;font-size:12px;letter-spacing:.35em;margin-bottom:10px}
    .shake{animation:shake .42s}.flash{animation:flash .55s}.rarity-common{color:#747b82}.rarity-uncommon{color:#39b77d}.rarity-rare{color:#4c88db}.rarity-epic{color:#9857cf}.rarity-legendary{color:#d89d25}.rarity-mythic{color:#d64a50}.rarity-divine{color:transparent;background:linear-gradient(90deg,#f06,#f90,#62d,#08d,#62d,#f06);background-size:300%;-webkit-background-clip:text;animation:rainbow 2s linear infinite}
    .divine-bg{animation:divineBg 2s ease}.darken:after{content:"";position:absolute;inset:0;z-index:19;background:rgba(12,14,17,.45);animation:flashDark .9s forwards}@keyframes particle{to{transform:translate(var(--x),var(--y)) rotate(540deg);opacity:0}}@keyframes reveal{0%{opacity:0;transform:translate(-50%,-50%) scale(.7)}18%{opacity:1;transform:translate(-50%,-55%) scale(1)}70%{opacity:1}100%{opacity:0;transform:translate(-50%,-72%) scale(.92)}}@keyframes shake{25%{transform:translateX(-7px)}50%{transform:translateX(7px)}75%{transform:translateX(-4px)}}@keyframes flash{50%{filter:brightness(1.8)}}@keyframes rainbow{to{background-position:300%}}@keyframes divineBg{50%{filter:saturate(1.25)}}@keyframes flashDark{to{opacity:0}}
    @media(max-width:1050px){body{overflow:auto}.app{height:auto;min-height:100vh;grid-template-columns:minmax(300px,40vw) minmax(230px,24vw);padding:16px}.left{grid-row:2}.right{grid-column:2}.roller-wrap{grid-column:1;height:76vh}.topbar{display:none}}@media(max-width:720px){.app{display:flex;flex-direction:column}.roller-wrap{width:min(92vw,430px);height:68vh}.left,.right{width:min(92vw,430px);height:auto}.left{order:2}.right{order:3}}
  </style>
</head>
<body>
<div class="effects" id="effects"></div><div class="drawer" id="drawer"><div class="drawer-head"><div><div class="eyebrow">YOUR VAULT</div><h2 id="foundCount">Found: 0 / 250</h2></div><button class="close" id="closeDrawer">×</button></div><div class="collection-grid" id="collectionGrid"></div></div>
<div class="app" id="app">
  <aside class="left">
    <button class="collection-btn" id="openDrawer">◆ &nbsp; COLLECTION</button>
    <section class="panel luck"><div class="eyebrow">LUCK MULTIPLIER</div><div class="multiplier" id="multiplier">1.0×</div></section>
    <section class="panel boost"><div class="boost-head"><span class="boost-name">SUPER ROLL</span><span class="boost-owned" id="superOwned">0 stored</span></div><div class="progress"><i id="superBar"></i></div><div class="boost-foot"><span class="eyebrow" id="superNext">Next Super: 0/5</span><button class="use super" id="useSuper">USE 5×</button></div></section>
    <section class="panel boost"><div class="boost-head"><span class="boost-name">ULTRA ROLL</span><span class="boost-owned" id="ultraOwned">0 stored</span></div><div class="progress"><i id="ultraBar"></i></div><div class="boost-foot"><span class="eyebrow" id="ultraNext">Next Ultra: 0/25</span><button class="use ultra" id="useUltra">USE 20×</button></div></section>
  </aside>
  <main class="roller-wrap" id="rollerWrap"><div class="topbar"><div id="rollBadge">TOTAL 0</div><div id="modeBadge">NORMAL</div></div><div class="roller" id="roller"><div class="roulette" id="roulette"></div></div><div class="marker"></div><div class="roller-glass"></div></main>
  <aside class="right">
    <section class="panel equipped"><div class="eyebrow">EQUIPPED</div><div class="equipped-name" id="equippedName">NONE</div></section>
    <section class="panel stats"><div class="stat-row"><span>Total Rolls</span><b id="totalRolls">0</b></div><div class="stat-row"><span>Collection Progress</span><b id="collectionProgress">0%</b></div><div class="stat-row"><span>Best Roll</span><b id="bestRoll">—</b></div></section>
    <section class="panel auto"><div class="right-head"><div><div class="eyebrow">AUTO ROLL</div></div><button class="switch" id="autoSwitch"><i></i></button></div></section>
    <button class="roll-btn" id="rollBtn">ROLL</button>
    <section class="panel test"><div class="eyebrow">DEVELOPER TEST</div><select id="testSelect"><option value="">Random result</option></select></section>
  </aside>
</div>
<script>
const rarityInfo=[
 ['Common','#747b82',46],['Uncommon','#39b77d',27],['Rare','#4c88db',16],['Epic','#9857cf',7.5],['Legendary','#d89d25',2.7],['Mythic','#d64a50',.72],['Divine','#ea66b6',.08]
];
const prefixes=['Stone','Cloud','Shadow','Solar','Void','Crystal','Frost','Phantom','Nova','Prism','Iron','Nebula','Ghost','Lunar','Storm','Galaxy','Quantum','Core','Aether','Omega'];
const suffixes=['Fragment','Shard','Crown','Vessel','Pulse','Wing','Core','Relic','Sigil','King','Blade','Orb','Star','Heart','Titan','Emperor','Dragon','God','Void','Genesis'];
const items=[];
let id=0;
for(let r=0;r<rarityInfo.length;r++){
 const count=r===6?20:r===5?30:r===4?40:r===3?45:r===2?45:r===1?35:35;
 for(let i=0;i<count;i++){
  const special=r===6?['Divine King','Eternal Zero','Rainbow Apex','Celestial Crown'][i%4]:null;
  items.push({id:id++,name:special||`${prefixes[(i+r*3)%prefixes.length]} ${suffixes[(i*7+r)%suffixes.length]}`,rarity:rarityInfo[r][0],color:rarityInfo[r][1]});
 }
}
while(items.length<250)items.push({id:id++,name:`Lost Artifact ${id}`,rarity:'Common',color:'#747b82'});
const $=s=>document.querySelector(s), roulette=$('#roulette'), found=new Set(), state=JSON.parse(localStorage.getItem('rngRollState')||'null')||{total:0,super:0,ultra:0,equipped:null,best:null};
let rolling=false,auto=false,superPending=false,ultraPending=false,testResult='';
const rarityClass=r=>'rarity-'+r.toLowerCase();
function renderBase(){roulette.innerHTML='';for(let i=0;i<250;i++){const it=items[(i*73)%items.length];const row=document.createElement('div');row.className='row';row.innerHTML=`<div class="name ${rarityClass(it.rarity)}">${it.name}</div><div class="rarity" style="color:${it.color}">${it.rarity}</div>`;roulette.appendChild(row)} }
function animateNumber(el,to,formatter=v=>v){const from=+el.dataset.value||0,d=400,t=performance.now();el.dataset.value=to;function tick(n){const p=Math.min(1,(n-t)/d),v=from+(to-from)*(1-Math.pow(1-p,3));el.textContent=formatter(v);if(p<1)requestAnimationFrame(tick)}requestAnimationFrame(tick)}
function save(){localStorage.setItem('rngRollState',JSON.stringify(state))}
function updateUI(){const mult=(superPending?5:1)*(ultraPending?20:1);$('#multiplier').textContent=mult.toFixed(1)+'×';$('#totalRolls').textContent=state.total;$('#rollBadge').textContent='TOTAL '+state.total;$('#superOwned').textContent=state.super+' stored';$('#ultraOwned').textContent=state.ultra+' stored';$('#superNext').textContent=`Next Super: ${(state.total%5)}/5`;$('#ultraNext').textContent=`Next Ultra: ${(state.total%25)}/25`;$('#superBar').style.width=((state.total%5)/5*100)+'%';$('#ultraBar').style.width=((state.total%25)/25*100)+'%';$('#collectionProgress').textContent=Math.round(found.size/items.length*100)+'%';$('#foundCount').textContent=`Found: ${found.size} / ${items.length}`;$('#bestRoll').textContent=state.best?.name||'—';const eq=items.find(x=>x.id===state.equipped);$('#equippedName').textContent=eq?.name||'NONE';$('#equippedName').className='equipped-name '+(eq?rarityClass(eq.rarity):'')}
function randomRoll(){if(testResult){const x=items.find(i=>i.name===testResult);testResult='';$('#testSelect').value='';return x}let mult=(superPending?5:1)*(ultraPending?20:1);const roll=Math.random()*100;let rarity;if(roll<.08*mult)rarity='Divine';else if(roll<.72*mult)rarity='Mythic';else if(roll<3.42*mult)rarity='Legendary';else if(roll<10.92*mult)rarity='Epic';else if(roll<26.92*mult)rarity='Rare';else if(roll<53.92*mult)rarity='Uncommon';else rarity='Common';const pool=items.filter(i=>i.rarity===rarity);return pool[Math.floor(Math.random()*pool.length)]||items[0]}
function particles(color,count=28){const holder=$('#effects');for(let i=0;i<count;i++){const p=document.createElement('i');p.className='particle';p.style.left=(window.innerWidth/2)+'px';p.style.top=(window.innerHeight/2)+'px';p.style.background=color;p.style.setProperty('--x',(Math.random()*600-300)+'px');p.style.setProperty('--y',(Math.random()*500-250)+'px');holder.appendChild(p);setTimeout(()=>p.remove(),1500)}}
function rarityEffects(item){const holder=$('#effects'),r=item.rarity;let text=r.toUpper??r;if(r==='Divine'||r==='Mythic'||r==='Legendary'){const el=document.createElement('div');el.className='reveal '+rarityClass(r);el.innerHTML=`<span>${r.toUpperCase()}</span>${item.name}`;holder.appendChild(el);setTimeout(()=>el.remove(),1500)}if(r==='Divine'){particles('#ffffff',120);document.body.classList.add('divine-bg');$('#app').classList.add('shake');setTimeout(()=>{document.body.classList.remove('divine-bg');$('#app').classList.remove('shake')},1200)}else if(r==='Mythic'){particles(item.color,70);$('#app').classList.add('shake');setTimeout(()=>$('#app').classList.remove('shake'),700)}else if(r==='Legendary'||r==='Epic')particles(item.color,45);else particles(item.color,18)}
function roll(){if(rolling)return;rolling=true;$('#rollBtn').disabled=true;const item=randomRoll();const fast=state.total>=500&&$('#modeBadge').dataset.fast==='on';const duration=fast?1200:2500;const rowHeight=94,cycles=12+Math.floor(Math.random()*5),targetIndex=100+cycles*250+(item.id%250),center=targetIndex*rowHeight-rowHeight/2;roulette.style.transition='none';roulette.style.transform='translateY(0px)';void roulette.offsetWidth;
  const start=-((targetIndex*rowHeight)-(window.innerHeight*.41));roulette.style.transition=`transform ${duration}ms cubic-bezier(.04,.65,.12,1)`;roulette.style.transform=`translateY(${-targetIndex*rowHeight+($('#roller').clientHeight/2-rowHeight/2)}px)`;
  $('#rollerWrap').animate([{filter:'brightness(1)'},{filter:'brightness(.78)',offset:.15},{filter:'brightness(1)',offset:.85},{filter:'brightness(1.15)'}],{duration,fill:'both'});setTimeout(()=>{roulette.animate([{transform:roulette.style.transform},{transform:`${roulette.style.transform} translateY(-8px)`},{transform:roulette.style.transform}],{duration:380,easing:'cubic-bezier(.2,.8,.2,1)'})},duration-420);
  setTimeout(()=>{rolling=false;$('#rollBtn').disabled=false;found.add(item.id);if(!state.best||rarityInfo.findIndex(r=>r[0]===item.rarity)>rarityInfo.findIndex(r=>r[0]===state.best.rarity))state.best=item;state.total++;if(state.total%5===0)state.super++;if(state.total%25===0)state.ultra++;superPending=false;ultraPending=false;save();updateUI();renderCollection();rarityEffects(item);if(auto)setTimeout(roll,650)},duration);
}
function renderCollection(){const grid=$('#collectionGrid');grid.innerHTML='';items.forEach(item=>{const card=document.createElement('div');const owned=found.has(item.id);card.className='item-card'+(!owned?' locked':'')+(state.equipped===item.id?' equipped':'');card.innerHTML=`<small style="color:${item.color}">${item.rarity}</small><strong class="${rarityClass(item.rarity)}">${owned?item.name:'???'}</strong>`;if(owned)card.onclick=()=>equip(item);grid.appendChild(card)})}
function equip(item){const old=state.equipped;state.equipped=item.id;save();updateUI();renderCollection();$('#equippedName').animate([{opacity:0,transform:'translateY(8px)'},{opacity:1,transform:'translateY(0)'}],{duration:400})}
$('#openDrawer').onclick=()=>$('#drawer').classList.add('open');$('#closeDrawer').onclick=()=>$('#drawer').classList.remove('open');$('#rollBtn').onclick=roll;
$('#useSuper').onclick=()=>{if(state.super&&rolling===false){state.super--;superPending=!superPending;save();updateUI();multiplierEffect()}};$('#useUltra').onclick=()=>{if(state.ultra&&rolling===false){state.ultra--;ultraPending=!ultraPending;save();updateUI();multiplierEffect()}};
function multiplierEffect(){const m=(superPending?5:1)*(ultraPending?20:1);if(m>1){const el=document.createElement('div');el.className='reveal';el.innerHTML=`<span>LUCK ACTIVATED</span>${m}× LUCK`;$('#effects').appendChild(el);setTimeout(()=>el.remove(),1500);$('#app').classList.add('shake');setTimeout(()=>$('#app').classList.remove('shake'),500)}}
$('#autoSwitch').onclick=e=>{auto=!auto;e.currentTarget.classList.toggle('on',auto);$('#modeBadge').textContent=auto?'AUTO':'NORMAL';if(auto&&!rolling)setTimeout(roll,300)};
const fastBtn=document.createElement('button');fastBtn.className='switch';fastBtn.innerHTML='<i></i>';fastBtn.style.position='absolute';fastBtn.style.right='26px';fastBtn.style.top='26px';fastBtn.style.zIndex='40';fastBtn.id='fastSwitch';$('#rollerWrap').appendChild(fastBtn);fastBtn.onclick=()=>{if(state.total>=500){fastBtn.classList.toggle('on');fastBtn.classList.toggle('on');const on=fastBtn.classList.contains('on');$('#modeBadge').dataset.fast=on?'on':'off';$('#modeBadge').textContent=on?'FAST':'NORMAL'}};
items.forEach(i=>{$('#testSelect').add(new Option(i.name,i.name))});$('#testSelect').onchange=e=>testResult=e.target.value;
renderBase();renderCollection();updateUI();if(state.equipped){}setInterval(()=>{if(!rolling&&!auto){$('#rollerWrap').animate([{filter:'brightness(1)'},{filter:'brightness(1.015)'}],{duration:1800,easing:'ease-in-out',iterations:1})}},2600);
</script>
</body></html>
